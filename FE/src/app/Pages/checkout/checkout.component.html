<div class="checkout-container">
    <!-- Stepper Navigation -->
    <div class="stepper">
      <div [class.active]="currentStep === 1">1. Address</div>
      <div [class.active]="currentStep === 2">2. Order Summary</div>
      <div [class.active]="currentStep === 3">3. Payment</div>
    </div>
  
    <!-- Dynamic Content Rendering -->
    <div class="checkout-content">
      <ng-container *ngIf="currentStep === 1">
        <ng-template #addressStep>
          <h3>Shipping Information</h3>
          <form>
            <input type="text" placeholder="Full Name" [(ngModel)]="address.fullName">
            <input type="email" placeholder="Email" [(ngModel)]="address.email">
            <input type="tel" placeholder="Phone Number" [(ngModel)]="address.phone">
            <input type="text" placeholder="City" [(ngModel)]="address.city">
            <input type="text" placeholder="State" [(ngModel)]="address.state">
            <input type="text" placeholder="ZIP Code" [(ngModel)]="address.zip">
          </form>
        </ng-template>
        <ng-container *ngTemplateOutlet="addressStep"></ng-container>
      </ng-container>
  
      <ng-container *ngIf="currentStep === 2">
        <ng-template #orderSummaryStep>
          <h3>Order Summary</h3>
          <ul>
            <li *ngFor="let item of items">
              {{ item.name }} - ${{ item.price }}
            </li>
          </ul>
          <p><strong>Total:</strong> ${{ getTotal() }}</p>
        </ng-template>
        <ng-container *ngTemplateOutlet="orderSummaryStep"></ng-container>
      </ng-container>
  
      <ng-container *ngIf="currentStep === 3">
        <ng-template #paymentStep>
          <h3>Payment Method</h3>
          <form>
            <input type="text" placeholder="Card Number" [(ngModel)]="card.number">
            <input type="text" placeholder="Expiry Date (MM/YY)" [(ngModel)]="card.expiry">
            <input type="text" placeholder="CVV" [(ngModel)]="card.cvv">
          </form>
        </ng-template>
        <ng-container *ngTemplateOutlet="paymentStep"></ng-container>
      </ng-container>
    </div>
  
    <!-- Navigation Buttons -->
    <div class="checkout-actions">
      <button (click)="prevStep()" [disabled]="currentStep === 1">Back</button>
      <button (click)="nextStep()" *ngIf="currentStep < 3">Next</button>
      <button *ngIf="currentStep === 3">Confirm & Pay</button>
    </div>
  </div>
