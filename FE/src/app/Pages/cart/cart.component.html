<div class="cart-page">
    <h2>Shopping Cart</h2>
    <div class="cart-container">
        <!-- Scrollable Table -->
        <div class="table-wrapper">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let product of cartItems; let i = index">
                        <td><img [src]="product.image" alt="product image" class="cart-img"></td>
                        <td>{{ product.name }}</td>
                        <td>
                            <div class="quantity-control">
                                <button (click)="decreaseQuantity(i)" [disabled]="product.quantity <= 1">-</button>
                                <input type="number" [(ngModel)]="product.quantity" min="1" [max]="product.maxQuantity" />
                                <button (click)="increaseQuantity(i)" [disabled]="product.quantity >= product.maxQuantity">+</button>
                            </div>
                        </td>
                        <td class="price">{{ product.price | currency }}</td>
                        <td>
                            <button class="delete-btn" (click)="removeFromCart(i)">×</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="cart-footer">
            <p>Total: <span>{{ updateTotal() | currency }}</span></p>
            <button id="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>
</div>
