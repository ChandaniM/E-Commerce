<nav class="navbar navbar-expand-lg bg-light shadow-sm px-3" >
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="/images/brandlogo.png" alt="Brandlogo" height="40">
    </a>
    <div class="search-container">
      <input class="form-control" type="search" placeholder="Search" aria-label="Search">
      <button type="submit">
        <i class="bi bi-search"></i>
      </button>
    </div>
    <div class="right-element">
      <i class="bi bi-heart fs-4 m-3"></i>
      <div style="position: relative;">
        <span class="count">{{cartElementCount}}</span>
        <i (click)="cart.toggleCart()" class="bi bi-cart2 fs-4 m-3"></i>
      </div>
      <span class="parentDropdow">
        <i (click)="toggleDropdown()"class="bi bi-person fs-3 m-3"></i>
        @if(isDropdownOpen){
          <div class="childdropdown">
            @if(isLoggedIn){
              <p (click)="logout()">Logout</p>
            }
            @else{
              <p (click)="login()">Login</p>
            }
            <p (click)="openUserProfile()">Profile</p>
          </div>
        }
      </span>
    </div>
  </div>
</nav>
<cart-sidebar #cart></cart-sidebar>
