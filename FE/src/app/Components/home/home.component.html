<navbar></navbar>
<div class="container mt-4">
  <!-- <app-offer-banner></app-offer-banner> -->

  <!-- Filters Section -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="filters">
      <button class="btn btn-outline-secondary me-2">Headphone Type</button>
      <button class="btn btn-outline-secondary me-2">Price</button>
      <button class="btn btn-outline-secondary me-2">Review</button>
      <button class="btn btn-outline-secondary me-2">Color</button>
      <button class="btn btn-outline-secondary">More Filters</button>
    </div>
    <div>
      <label for="sort" class="me-2">Sort By:</label>
      <select id="sort" class="form-select d-inline w-auto">
        <option value="popularity">Popularity</option>
        <option value="price-low-high">Price: Low to High</option>
        <option value="price-high-low">Price: High to Low</option>
      </select>
    </div>
  </div>

  <!-- Product Grid -->
  <div class="row">
    <div class="col-md-3" *ngFor="let product of products">
      <card [product]="products"></card>
    </div>
  </div>
</div>
