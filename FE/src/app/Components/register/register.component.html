<div class="Register">
  <div class="form-container">
    <h3 class="text-center">Register</h3>
    <p class="text-center">Best place to buy and sell digital products.</p>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="first_name" class="form-label">First Name*</label>
          <input type="text" id="first_name" class="form-control" formControlName="first_name" placeholder="Enter your first name">
        </div>

        <div class="col-md-6">
          <label for="last_name" class="form-label">Last Name*</label>
          <input type="text" id="last_name" class="form-control" formControlName="last_name" placeholder="Enter your last name">
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Email*</label>
          <input type="email" id="email" class="form-control" formControlName="email" placeholder="Enter your email">
        </div>

        <div class="col-md-6">
          <label for="phone_number" class="form-label">Phone Number*</label>
          <input type="text" id="phone_number" class="form-control" formControlName="phone_number" placeholder="Enter your phone number">
        </div>

        <div class="col-md-12">
          <label for="address" class="form-label">Address</label>
          <input type="text" id="address" class="form-control" formControlName="address" placeholder="Address Line 1">
        </div>

        <div class="col-md-6">
          <label for="city" class="form-label">City*</label>
          <select id="city" class="form-select" formControlName="city">
            <option value="">City</option>
            <option value="delhi">Delhi</option>
            <option value="mumbai">Mumbai</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="postal_code" class="form-label">Post Code</label>
          <input type="text" id="postal_code" class="form-control" formControlName="postal_code" placeholder="Post Code">
        </div>

        <div class="col-md-6">
          <label for="role" class="form-label">Role</label>
          <select id="role" class="form-select" formControlName="role">
            <option value="customer">Customer</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="state" class="form-label">Region/State</label>
          <select id="state" class="form-select" formControlName="state">
            <option value="">Region/State</option>
            <option value="maharashtra">Maharashtra</option>
            <option value="gujarat">Gujarat</option>
          </select>
        </div>

        <div class="col-md-12 d-flex justify-content-between">
          <div>Already have an account? <a href="/login">Login</a></div>
          <button type="submit" class="btn btn-dark" [disabled]="!userForm.valid">Register</button>
        </div>
      </div>
    </form>
  </div>
</div>
