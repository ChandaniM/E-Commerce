<div class="Category">
    <div class="form">
        <h4>Add New Category</h4>
        <div>
            <div class="">
                <label class="">Main Category Name</label>
                <input type="text" placeholder="Category Name">
            </div>
            <div>
                <label for="">Name</label>
                <input type="text" placeholder="Type Category Name">
            </div>
            <div class="">
                <label for="">Slug</label>
                <input type="text" placeholder="Slug">
            </div>
            <div class="">
                <label for="">Sort Description</label>
                <input type="text" placeholder="Sort Description">
            </div>
            <div class="">
                <label for="">Full Description</label>
                <input type="text" placeholder="Full Description">
            </div>
            <div>
                <label for="">Product Tags ( Type and make comma to separate tags )</label>
                <input type="text" name="" id="">
            </div>
            <div>
                <select name="" id="">
                    <option value="">Active</option>
                    <option value="">Inactive</option>
                </select>
            </div>

            <button class="add-category-btn">Submit</button>
        </div>
    </div>
    <div class="">
        <table id="cat_data_table" class="table dataTable no-footer" aria-describedby="cat_data_table_info">
            <thead>
                <tr>
                    <th class="sorting" tabindex="0" aria-controls="cat_data_table" rowspan="1" colspan="1"
                        aria-label="Name: activate to sort column ascending" style="width: 109.375px;">Name</th>
                    <th class="sorting" tabindex="0" aria-controls="cat_data_table" rowspan="1" colspan="1"
                        aria-label="Main Categories: activate to sort column ascending" style="width: 160.336px;">Main
                        Categories</th>
                    <th class="sorting" tabindex="0" aria-controls="cat_data_table" rowspan="1" colspan="1"
                        aria-label="Product: activate to sort column ascending" style="width: 79.2812px;">Product</th>
                    <th class="sorting sorting_desc" tabindex="0" aria-controls="cat_data_table" rowspan="1" colspan="1"
                        aria-label="Status: activate to sort column ascending" style="width: 66.6328px;"
                        aria-sort="descending">Status</th>
                    <th class="sorting" tabindex="0" aria-controls="cat_data_table" rowspan="1" colspan="1"
                        aria-label="Trending: activate to sort column ascending" style="width: 89.5469px;">Trending</th>
                    <th class="sorting" tabindex="0" aria-controls="cat_data_table" rowspan="1" colspan="1"
                        aria-label="Action: activate to sort column ascending" style="width: 66.8281px;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr class="even">
                    <td class="">Sofa seat</td>
                    <td>
                        <span class="gi-sub-cat-list">
                            <span class="gi-sub-cat-tag">Furniture</span>
                        </span>
                    </td>
                    <td>48</td>
                    <td class="active sorting_1">ACTIVE</td>
                    <td><span class="badge bg-primary">Medium</span></td>
                    <td>
                        <div class="action-dropdown">
                            <button type="button" class="btn btn-outline-success dropdown-toggle dropdown-toggle-split"
                                data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                                data-display="static">
                                <span class="sr-only"><i class="bi bi-gear"></i></span>
                            </button>

                            <div class="dropdown-menu">
                                <a class="dropdown-item" href="#">Edit</a>
                                <a class="dropdown-item" href="#">Delete</a>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
