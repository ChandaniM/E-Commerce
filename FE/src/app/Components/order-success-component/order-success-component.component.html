<div class="order-success">
  <div class="close" (click)="close()">
    <i class="bi bi-x"></i>
  </div>
  <img
    src="/images/congratulations.png"
    alt="Congratulations"
    class="success-gif"
    (click)="close()"
  />
  <h2>Your order is placed!</h2>
  <p>Thank you for shopping with us. Your order will be delivered soon.</p>
  <button class="continue-btn" (click)="continueShopping()">
    Continue Shopping
  </button>
</div>
